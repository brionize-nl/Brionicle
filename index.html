<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brionicle</title>
    <meta name="description" content="Interactieve kaart met live verkeerscamera's, vliegtuigradar en weer">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="map"></div>
    <div id="vignette"></div>
    <div class="compass-rose">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <polygon points="50,5 46,47 50,50" fill="#2c1e0f"/>
            <polygon points="50,5 54,47 50,50" fill="#7a6548"/>
            <polygon points="95,50 53,46 50,50" fill="#5c4530"/>
            <polygon points="95,50 53,54 50,50" fill="#a08b6c"/>
            <polygon points="50,95 54,53 50,50" fill="#5c4530"/>
            <polygon points="50,95 46,53 50,50" fill="#a08b6c"/>
            <polygon points="5,50 47,54 50,50" fill="#2c1e0f"/>
            <polygon points="5,50 47,46 50,50" fill="#7a6548"/>
            <polygon points="79,21 54,46 50,50" fill="#5c4530" opacity="0.5"/>
            <polygon points="79,21 46,54 50,50" fill="#a08b6c" opacity="0.3"/>
            <polygon points="79,79 54,54 50,50" fill="#5c4530" opacity="0.5"/>
            <polygon points="79,79 46,46 50,50" fill="#a08b6c" opacity="0.3"/>
            <polygon points="21,79 46,54 50,50" fill="#5c4530" opacity="0.5"/>
            <polygon points="21,79 54,46 50,50" fill="#a08b6c" opacity="0.3"/>
            <polygon points="21,21 46,46 50,50" fill="#5c4530" opacity="0.5"/>
            <polygon points="21,21 54,54 50,50" fill="#a08b6c" opacity="0.3"/>
            <circle cx="50" cy="50" r="4" fill="#c5a55a" stroke="#2c1e0f" stroke-width="0.8"/>
            <circle cx="50" cy="50" r="1.5" fill="#2c1e0f"/>
            <text x="50" y="2" text-anchor="middle" font-size="9" font-weight="bold" fill="#c5a55a" font-family="Georgia, serif">N</text>
        </svg>
    </div>

    <div id="panel" class="panel">
        <button id="panel-close" class="panel-close" aria-label="Sluiten">&times;</button>
        <div id="panel-content">
            <div id="panel-header">
                <h2 id="panel-title"></h2>
                <p id="panel-subtitle"></p>
            </div>
            <div id="panel-camera" class="panel-section">
                <div id="camera-container"></div>
            </div>
            <div id="panel-weather" class="panel-section"></div>
            <div id="panel-sun" class="panel-section"></div>
        </div>
    </div>

    <div class="top-controls">
        <div id="layers-toggle" class="layers-toggle">
            <button id="layers-btn" aria-label="Lagen">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </button>
            <div id="layers-menu" class="layers-menu hidden">
                <div class="layers-group">
                    <span class="layers-label">Kaartstijl</span>
                    <label><input type="radio" name="mapstyle" value="old-world" checked> Oude kaart</label>
                    <label><input type="radio" name="mapstyle" value="dark"> Donker</label>
                </div>
                <div class="layers-group">
                    <label><input type="checkbox" id="layer-cameras" checked> Camera's</label>
                    <label><input type="checkbox" id="layer-weather" checked> Weer bij klik</label>
                </div>
                <div class="layers-group">
                    <label><input type="checkbox" id="layer-flights"> Vliegtuigradar</label>
                </div>
            </div>
        </div>
        <button id="locate-btn" class="locate-btn" aria-label="Mijn locatie">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
            </svg>
        </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/cameras.js"></script>
    <script src="js/flights.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
