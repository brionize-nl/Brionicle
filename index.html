<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brionicle</title>
    <meta name="description" content="Interactieve wereldkaart met live camera's, weer, radio en meer">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="map"></div>

    <div id="panel" class="panel">
        <button id="panel-close" class="panel-close" aria-label="Sluiten">&times;</button>
        <div id="panel-content">
            <div id="panel-header">
                <h2 id="panel-title"></h2>
                <p id="panel-subtitle"></p>
            </div>
            <div id="panel-weather" class="panel-section"></div>
            <div id="panel-sun" class="panel-section"></div>
            <div id="panel-extra" class="panel-section"></div>
            <div id="panel-camera" class="panel-section">
                <div id="camera-container"></div>
            </div>
            <div id="panel-wiki" class="panel-section"></div>
            <div id="panel-radio" class="panel-section"></div>
        </div>
    </div>

    <div class="top-controls">
        <div id="layers-toggle" class="layers-toggle">
            <button id="layers-btn" aria-label="Lagen">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </button>
        <div id="layers-menu" class="layers-menu hidden">
            <div class="layers-group">
                <label><input type="checkbox" id="layer-cameras" checked> Camera's</label>
                <label><input type="checkbox" id="layer-weather" checked> Weer bij klik</label>
            </div>
            <div class="layers-group">
                <label><input type="checkbox" id="layer-earthquakes"> Aardbevingen</label>
                <label><input type="checkbox" id="layer-iss"> ISS</label>
                <label><input type="checkbox" id="layer-ufo"> UFO Meldingen</label>
            </div>
            <div class="layers-group">
                <label><input type="checkbox" id="layer-festivals"> Festivals & Events</label>
                <label><input type="checkbox" id="layer-monuments"> Monumenten</label>
                <label><input type="checkbox" id="layer-telescopes"> Telescopen</label>
            </div>
            <div class="layers-group">
                <label><input type="checkbox" id="layer-roadtrip"> Roadtrip modus</label>
            </div>
        </div>
        <button id="locate-btn" class="locate-btn" aria-label="Mijn locatie">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path>
            </svg>
        </button>
    </div>

    <div id="roadtrip-panel" class="roadtrip-panel hidden">
        <div class="rt-header">
            <span style="font-size:13px;font-weight:600;">Roadtrip</span>
            <button id="rt-close" style="background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;">&times;</button>
        </div>
        <div class="rt-controls">
            <div class="rt-point" id="rt-start" style="cursor:pointer;">
                <span style="color:var(--success);font-size:14px;">&#9679;</span>
                <span id="rt-start-text" style="font-size:12px;">Klik op kaart...</span>
            </div>
            <div class="rt-point" id="rt-end" style="cursor:pointer;">
                <span style="color:var(--error);font-size:14px;">&#9679;</span>
                <span id="rt-end-text" style="font-size:12px;">Klik op kaart...</span>
            </div>
            <button id="rt-clear" style="background:var(--bg);border:1px solid var(--border);color:var(--text-dim);padding:4px 12px;border-radius:4px;font-size:11px;cursor:pointer;margin-top:4px;">Wissen</button>
        </div>
        <div id="rt-info"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/cameras.js"></script>
    <script src="js/wikipedia.js"></script>
    <script src="js/radio.js"></script>
    <script src="js/earthquakes.js"></script>
    <script src="js/iss.js"></script>
    <script src="js/aurora.js"></script>
    <script src="js/pins.js"></script>
    <script src="js/ufo.js"></script>
    <script src="js/roadtrip.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
