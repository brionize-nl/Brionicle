<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brionicle</title>
    <meta name="description" content="Interactieve wereldkaart met live camera's, weer, radio en meer">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="map"></div>

    <div id="panel" class="panel">
        <button id="panel-close" class="panel-close" aria-label="Sluiten">&times;</button>
        <div id="panel-content">
            <div id="panel-header">
                <h2 id="panel-title"></h2>
                <p id="panel-subtitle"></p>
            </div>
            <div id="panel-weather" class="panel-section"></div>
            <div id="panel-sun" class="panel-section"></div>
            <div id="panel-camera" class="panel-section">
                <div id="camera-container"></div>
            </div>
        </div>
    </div>

    <div id="layers-toggle" class="layers-toggle">
        <button id="layers-btn" aria-label="Lagen">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                <polyline points="2 17 12 22 22 17"></polyline>
                <polyline points="2 12 12 17 22 12"></polyline>
            </svg>
        </button>
        <div id="layers-menu" class="layers-menu hidden">
            <label><input type="checkbox" id="layer-cameras" checked> Camera's</label>
            <label><input type="checkbox" id="layer-weather" checked> Weer bij klik</label>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/cameras.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
